# ── 키맵 설정 (Windows + 데몬) ─────────────────────────────────
# CapsLock 홀드 = 네비 레이어. 단어 단위 이동은 Windows 표준대로 Ctrl+화살표.
#
# 설계 불변식 (2026-08-12): 레이어에는 오발사해도 무해한 액션만 둔다.
# P(붙여넣기)/Y(줄 복사)/U(줄 삭제)/,(단어 삭제)는 제거 — CapsLock과 LShift가
# 같은 새끼손가락 인접 키라 한글 Shift 조합(ㅖ=Shift+P 등) 오타가 비싼
# 오발사로 이어졌다. ','는 최빈 삭제 키 '.' 옆의 완충 빈칸으로 비워 둔다.
#
# 더블탭 원칙: 연타 개념이 없는 키에만 건다.
# Backspace(.)/Delete(/)는 연타 빈도가 가장 높은 키라 더블탭을 걸면
# "두 글자 지우기"가 오발사된다 → 삭제키는 평범한 매핑으로 둔다.
# I/O 단어 이동은 연타가 곧 "더 멀리"라 더블탭(줄 처음/끝)이 잘 맞는다.

[launcher.keymap]
active_profile = "vim-nav"

[launcher.keymap.layers.nav]
# 0.13.0부터 기본: CapsLock 홀드 = 레이어 (docs/13).
# Alt는 트리거가 아니므로 앱들의 Alt 단축키가 온전히 동작한다.
# 짧게 탭 = 무동작 — 한/영 전환은 RAlt 탭(물리 한영키, 마우스 레이어 트리거).
# 탭 한영으로 되돌리려면: tap_action = "Hangul"
trigger = "CapsLock"
tap_hold_ms = 200
# 이전 방식(LAlt 홀드)으로 되돌리려면 위를 아래로 교체 후 데몬 재시작.
# LAlt 트리거로 돌아가면 CapsLock은 HHKB식 모드탭(탭=Caps/홀드=Ctrl)이 된다.
# trigger = "LAlt"
# tap_action = "Escape"
# 미매핑 키 동작: "plain"(맨키 통과, 기본) | "passthrough"(트리거 조합을 OS로 투과,
# 예: Ctrl+Alt+H가 nav 매핑을 건너뛰고 OS로 간다) | "block"(억제)
#
# ※ 트리거가 modifier(LAlt 등)일 때만 의미가 있다. 그리고 Shift는 예외 —
#   Shift+네비 = 선택 확장이 더 유용해서 투과시키지 않는다. 즉 LAlt 트리거로
#   되돌려도 Ctrl+Alt+key는 살아나지만 Alt+key(리본 니모닉)와
#   Alt+Shift+key(HWP 자간좁히기)는 여전히 nav가 가로챈다.
#   자세한 트레이드오프: docs/16_keymap_ergonomics.md §5
# unmapped = "passthrough"

[launcher.keymap.layers.nav.mappings]
H = "Left"
J = "Down"
K = "Up"
L = "Right"
N = "PageUp"
M = "PageDown"
"." = "Backspace"
"/" = "Delete"
Space = "launch:kmd-desktop"
";" = "launch:kmd-desktop --memo"                # 런처를 :m 메모 입력으로 연다

# 단어/줄 이동 = I/O (중지+약지). 위 행은 손바닥에서 멀어지는 신전 동작이라
# 긴 손가락이 유리하다 — 적합도는 중지 ≥ 약지 > 검지. 검지가 강한 건 누르는
# 힘이지 뻗는 거리가 아니다. 게다가 검지는 이미 H/J/N/M 4키를 맡고 있어,
# U까지 얹으면 최빈 기능 5개가 한 손가락의 2행 왕복이 된다. (2026-08-20)
[launcher.keymap.layers.nav.double_taps.I]
single = "Ctrl+Left"
double = "Home"
timeout_ms = 300

[launcher.keymap.layers.nav.double_taps.O]
single = "Ctrl+Right"
double = "End"
timeout_ms = 300

# ── 마우스 레이어 (RAlt 홀드, 짧게 탭 = 한/영) ───────────────
# 기본 배치는 코드 내장이라 아래 블록 없이도 동작한다. 값을 바꾸고 싶을 때만
# 주석을 풀면 기본 위에 병합된다(미지정 키는 기본 유지).
#
#   E/S/D/F = 포인터 ↑←↓→   — 타이핑 홈포지션(검지 F)을 그대로 유지
#   W/R     = 좌/우클릭      — 이동 클러스터 왼쪽·오른쪽 = 마우스 버튼 좌/우
#   T/G     = 휠 ↑/↓        — 위 키는 위로, 아래 키는 아래로 (검지 세로열)
#   Space   = 좌클릭(홀드=드래그) — W는 S(←이동)와 같은 약지라 드래그는 엄지 담당
#   J/K/L   = 좌/우/중 클릭 (오른손 병행용)   LShift = 저속 정밀
#
# [launcher.keymap.layers.mouse.mappings]
# E = "mouse:up"
# S = "mouse:left"
# D = "mouse:down"
# F = "mouse:right"
# W = "mouse:click"
# R = "mouse:rclick"
# T = "mouse:wheel-up"
# G = "mouse:wheel-down"

# Shift+Space 한영: 데몬이 기본 등록. 재정의하려면 아래 주석 해제.
# [[launcher.keymap.combos]]
# trigger = "Shift+Space"
# action = "Hangul"

# ── 액션 문자열 형식 ──────────────────────────────────────
# "Home"              → 단일 키 전송
# "Ctrl+Left"         → 수정자+키 콤보 전송
# "Cmd+C"             → macOS에서만 Command (Windows에서는 LWin 매핑)
# "launch:kmd-desktop" → 프로그램 실행
# "macro:Home;Shift+End;Ctrl+C" → 여러 키 순차 실행 (;로 구분)
#
# 수정자: Ctrl, Shift, Alt, Cmd (= Win/Super/Meta)
# 키 이름: a-z, 0-9, f1-f12, Home, End, Left, Right, Up, Down,
#          PageUp, PageDown, Space, Enter, Escape, Tab, CapsLock,
#          Backspace, Delete, Insert, LAlt, RAlt, LCtrl, RCtrl,
#          LShift, RShift, LWin, Hangul, Hanja, Semicolon, Comma,
#          Period, Slash, Backslash, LBracket, RBracket, Minus, Equal
