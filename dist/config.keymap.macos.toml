# ── 키맵 설정 (macOS + 데몬) ─────────────────────────────────
# CapsLock 홀드 = 네비 레이어. 단어 단위 이동은 macOS 표준 Alt+Left/Right(= Option+화살표).
# 줄 처음/끝 더블탭은 Cmd+Left/Right.
#
# 설계 불변식 (2026-08-12): 레이어에는 오발사해도 무해한 액션만 둔다.
# P(붙여넣기)/Y(줄 복사)/U(줄 삭제)/,(단어 삭제)는 제거 — CapsLock과 LShift가
# 같은 새끼손가락 인접 키라 한글 Shift 조합(ㅖ=Shift+P 등) 오타가 비싼
# 오발사로 이어졌다. ','는 최빈 삭제 키 '.' 옆의 완충 빈칸으로 비워 둔다.
#
# 더블탭은 연타 개념이 없는 키에만 건다 — 삭제키(. /)에 걸면 "두 글자 지우기"
# 탭-탭이 오발사된다.

[launcher.keymap]
active_profile = "vim-nav"

[launcher.keymap.layers.nav]
# 0.13.0부터 기본: CapsLock 홀드 = 레이어 (docs/13).
# macOS는 데몬이 hidutil로 CapsLock→F19를 자동 재맵/원복한다 — 데몬 실행 중엔
# CapsLock 대문자 잠금이 비활성이다(정상 종료 시 자동 복구).
# 짧게 탭 = 무동작 — 한/영 전환은 RAlt 탭(물리 한영키 자리, 아래 mouse 레이어).
# 탭 한영으로 되돌리려면: tap_action = "Hangul"
trigger = "CapsLock"
tap_hold_ms = 200
# 이전 방식(LAlt 홀드 + 대문자 잠금 유지)으로 되돌리려면 아래로 교체 후 데몬 재시작.
# trigger = "LAlt"
# tap_action = "Escape"
# 미매핑 키 동작: "plain"(맨키 통과, 기본) | "passthrough"(트리거 조합을 OS로 투과,
# 예: Cmd+Alt+H가 nav 매핑을 건너뛰고 OS로 간다) | "block"(억제)
#
# ※ 트리거가 modifier(LAlt 등)일 때만 의미가 있다. 그리고 Shift는 예외 —
#   Shift+네비 = 선택 확장이 더 유용해서 투과시키지 않는다.
#   자세한 트레이드오프: docs/16_keymap_ergonomics.md §5
# unmapped = "passthrough"

[launcher.keymap.layers.nav.mappings]
H = "Left"
J = "Down"
K = "Up"
L = "Right"
N = "PageUp"
M = "PageDown"
"." = "Backspace"
"/" = "Delete"                                  # 전방 삭제 (fn+Delete)
Space = "launch:kmd-desktop"
";" = "launch:kmd-desktop --memo"                # 런처를 :m 메모 입력으로 연다

# 단어/줄 이동 = I/O (중지+약지). 위 행은 손바닥에서 멀어지는 신전 동작이라
# 긴 손가락이 유리하다 — 적합도는 중지 ≥ 약지 > 검지. 검지가 강한 건 누르는
# 힘이지 뻗는 거리가 아니다. 게다가 검지는 이미 H/J/N/M 4키를 맡고 있어,
# U까지 얹으면 최빈 기능 5개가 한 손가락의 2행 왕복이 된다. (2026-08-20)
#
# CapsLock+I 한 번: 이전 단어 (Option+←), 더블: 줄 시작 (Cmd+←)
[launcher.keymap.layers.nav.double_taps.I]
single = "Alt+Left"
double = "Cmd+Left"
timeout_ms = 300

# CapsLock+O 한 번: 다음 단어 (Option+→), 더블: 줄 끝 (Cmd+→)
[launcher.keymap.layers.nav.double_taps.O]
single = "Alt+Right"
double = "Cmd+Right"
timeout_ms = 300

# 마우스 레이어(RAlt 홀드) 기본: E/S/D/F 이동, W/R 좌/우클릭, T/G 휠 ↑/↓,
# Space 좌클릭(드래그용). 짧게 탭 = 한/영 전환 (물리 한영키 자리).
# 자세한 설명은 config.keymap.windows.toml 참고.

# Shift+Space 한영 콤보는 데몬이 기본 등록. 재정의하려면 아래 주석 해제.
# [[launcher.keymap.combos]]
# trigger = "Shift+Space"
# action = "Hangul"

# ── 액션 문자열 형식 ──────────────────────────────────────
# "Cmd+C" → macOS Command+키
# 기타는 config.keymap.windows.toml 주석과 동일
