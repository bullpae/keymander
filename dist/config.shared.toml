# ============================================================
# keymander (kmd) — 포터블 공통 설정
# ============================================================
#
# 이 파일 단독으로는 완전한 설정이 아닙니다.
# 배포 시 dist/config.keymap.<windows|macos|linux>.toml 과 합쳐져 kmd-data/config.toml 이 됩니다.
#
# 수동 합치기 (예시):
#   Windows:  Get-Content dist\config.shared.toml, dist\config.keymap.windows.toml | Set-Content kmd-data\config.toml -Encoding utf8
#   macOS:    cat dist/config.shared.toml dist/config.keymap.macos.toml > kmd-data/config.toml
#
# 설정 변경 방법:
#   - kmd-desktop 에서 :set 또는 :settings 입력
#   - kmd (TUI) 에서 F2 키
#   - CLI: kmd config set general.theme "nord"

# ── 일반 설정 ────────────────────────────────────────────────
[general]
# TUI 렌더링 FPS (기본: 30)
# render_fps = 30

# 미리보기 패널 표시 여부
# show_preview = true
# preview_width_percent = 40

# 테마: default | midnight | obsidian | snow | rose_pine | nord
# theme = "default"

# 이모지 아이콘 사용 (false = ASCII 2자 아이콘으로 대체)
# Windows 10 레거시 콘솔에서는 자동으로 false 적용
# emoji_icons = true

# Desktop 실행 시 IME를 영어 모드로 전환 (기본 켜짐)
# 런처 명령은 대부분 영문/기호로 시작하므로(@, :, ! 등) 한글 입력 상태에서
# 열려도 바로 칠 수 있게 한다. 끄려면 아래 줄의 주석을 풀고 false로.
reset_ime_on_launch = true

# Desktop 런처 기본 폰트 크기 (px)
# 모든 UI 요소가 이 값에 비례하여 자동 조절됨 (범위: 12–32, 기본: 16)
# font_size = 16

# Desktop 런처 결과창에 표시되는 행 수 (범위: 4–20, 기본: 8)
# visible_rows = 8

# Desktop 브랜드 아이콘 스타일: color (공식 풀컬러 로고) | mono (테마 틴트 단색 글리프)
# brand_icons = "color"

# Desktop 창 투명 처리: auto (투명 창 — 창 리사이즈 없음) | off (불투명 + 리사이즈)
# 투명 창이면 결과가 뜨고 사라질 때 창 크기가 바뀌지 않아 화면 찢어짐이 없다.
# 빈 영역이 검게 보이는 환경에서만 "off" 로 되돌린다.
# window_transparency = "auto"

# ── 런처 설정 ────────────────────────────────────────────────
[launcher]
# 파일 검색 엔진: auto | builtin | fd | everything | mdfind | locate | winfs
# file_search_provider = "auto"

# 최대 인덱스 항목 수 (기본: 5000)
# max_results = 5000

# 파일 탐색 최대 깊이 (기본: 4)
# search_depth = 4

# 실행 후 창 닫기
# quit_on_launch = true

# 데몬 백그라운드 인덱스 리프레시 주기 (분, 0 = off, 기본: 360 = 6시간)
# 데몬이 주기적으로 인덱스를 재빌드해 캐시를 갱신하므로 kmd-desktop은
# 실행 시점에 인덱싱 비용 없이 항상 신선한 캐시로 뜬다
# index_refresh_minutes = 360

# 디렉토리도 인덱스에 포함
# index_directories = true

# 드라이브 자동 스캔 (C:\, D:\ 등) — Windows
# scan_drives = false
# drive_scan_depth = 2

# 검색할 디렉토리 (기본: Desktop, Documents, Downloads)
# Windows 예: search_paths = ["C:\\Users\\사용자\\Documents", "D:\\Projects"]
# macOS 예:  search_paths = ["/Users/you/Documents"]

# ── 문서 본문 검색 (FTS5, docs/15) ──────────────────────────
# 스캔 범위는 search_paths·ignore_patterns·search_depth를 그대로 공유.
# CLI: kmd grep <질의>  (데몬이 리프레시 주기마다 자동 갱신)
# [launcher.content_search]
# enabled = true
# max_file_kb = 1024      # 파일당 크기 상한 (KB)
# extensions = []          # 비우면 내장 기본(플레인 텍스트·소스). 예: ["md", "txt"]
# max_files = 20000        # 본문 인덱스 대상 파일 수 상한

# ── 검색 우선순위 가중치 (0-100, 높을수록 상위) ──────────────
[launcher.kind_weights]
# directory = 80
# app = 70
# file = 50
# executable = 40
# system_cmd = 30
# web_search = 20

# ── 키 바인딩 ────────────────────────────────────────────────
[keybindings]
# kmd-desktop 실행 글로벌 핫키 (데몬 모드에서 동작)
# vim-nav 레이어와 독립적으로 항상 등록됨
# 형식: "수정자+키" (예: "alt+space", "ctrl+space", "cmd+j")
# 기본으로 켜 둔다 — 레이어 트리거를 LAlt에서 다른 키(CapsLock 등)로 바꾸면
# 레이어의 Space 매핑이 더는 Alt+Space 역할을 못 하므로, 독립 핫키가 필요하다.
global_hotkey = "alt+space"

# TUI 키 바인딩
# quit = "ctrl+c"
# next = "down"
# prev = "up"
# select = "enter"
# toggle_preview = "ctrl+p"

# ── 데몬 자동 시작 ───────────────────────────────────────────
# kmd-daemon install   → 부팅 시 자동 시작 등록
# kmd-daemon uninstall → 자동 시작 해제
# kmd-daemon status    → 현재 상태 및 자동 시작 등록 여부 확인
#
# Windows: Startup 폴더에 VBS 스크립트 생성 (콘솔 창 없이 실행)
# macOS:   ~/Library/LaunchAgents/com.keymander.daemon.plist
# Linux:   ~/.config/systemd/user/kmd-daemon.service
