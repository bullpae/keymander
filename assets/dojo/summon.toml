#
# 연습 목록은 결정론적이라 사부의 수(Par)가 공정하다. 일부러 이름이 겹치는
# 항목(fire/FileZilla, quote/quarterly …)을 섞어 "몇 글자로 1순위가 되는가"를
# 고민하게 한다. 이름은 영문 — 한글 음절은 한 글자가 여러 타인데 1타로 세면
# 불공정해진다.
#
# 의뢰는 둘 중 하나:
#   target = "항목 이름"        → 그 항목이 1순위인 상태에서 Enter
#   accept = ["@gh keymander"]  → 입력이 이 중 하나와 같으면 성공 (접두 비급)

