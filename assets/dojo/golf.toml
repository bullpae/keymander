  [[course.hole]]
  title = "아래 장으로"
  text = """
‸# keymander 수련 일지

## 1. 첫 60초
설치하고 런처를 부른다. 이름 몇 글자, 그리고 Enter.
찾지 말고 불러라. 소환 루프가 모든 것의 시작이다.

## 2. 화살표 없는 화살표
레이어를 쥐는 손과 움직이는 손은 항상 다르다.
오른손은 홈로우에서 방향을 만든다.
화살표 키로 손을 보내는 순간 홈로우를 떠난 것이다.

## 3. 축지법
적게 누르는 것이 곧 빠른 것이다.
단어 두 번이면 글자 열두 번이 필요 없다.
줄 처음과 끝은 같은 키를 두 번 톡톡.

## 4. 문서 수술
선택하고 한 번에 벤다. 글자 하나씩 지우지 않는다.
레이어는 에디터가 아니라 모든 앱에서 동작한다.

## 5. 한 손가락 두 얼굴
짧게 톡이면 한영, 길게 쥐면 레이어.

## 6. 보이지 않는 마우스
⚑멀리는 빠르게, 가까이는 느리게.
마구 쳐도 한 글자도 새지 않는다.

## 7. 하산
손이 떠나면 진다. 오늘도 홈로우 위에서."""

