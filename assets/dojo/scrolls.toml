# 비급 24권 — 배치 근거 하나가 한 권 (docs/10 §4-5)
#
# 비급은 "표준 배치"의 이치를 가르치므로 본문에 물리 키 이름을 그대로 쓴다.
# 시험(quiz)은 외운 답이 아니라 납득을 묻는다. answer 는 0부터 센다.

[[scroll]]
id = "一"
title = "두 손의 법칙"
body = """
레이어를 쥐는 손과 조작하는 손은 항상 다르다.
왼손 새끼로 CapsLock 을 쥐면 오른손이 HJKL 로 움직이고,
오른엄지로 RAlt 를 쥐면 왼손이 ESDF 로 포인터를 민다.
한 손으로 쥐어짜는 배치는 없다.
"""
source = "README 철학"
quiz = { q = "nav 레이어 트리거를 오른손 쪽 키로 옮기면 무엇이 깨지는가?", choices = ["쥐는 손과 움직이는 손이 같아진다", "한/영 전환이 느려진다", "레이어가 켜지지 않는다", "아무것도 깨지지 않는다"], answer = 0 }

[[scroll]]
id = "二"
title = "굴근은 신근보다 강하다"
body = """
손가락을 말아 당기는 힘(굴근)이 펴서 뻗는 힘(신근)보다 세다.
그래서 같은 거리라도 아래 행이 위 행보다 덜 힘들다.
"""
source = "docs/16 §2"
quiz = { q = "같은 거리라면 어느 행이 덜 힘든가?", choices = ["아래 행", "위 행", "똑같다", "숫자 행"], answer = 0 }

[[scroll]]
id = "三"
title = "위 행은 긴 손가락에게"
body = """
위 행은 손바닥에서 멀어지는 방향이라 뻗는 거리가 병목이다.
적합도는 중지 ≥ 약지 > 검지. 검지가 센 것은 누르는 힘이지 뻗는 거리가 아니다.
그래서 단어 이동은 U/I 가 아니라 I/O 에 있다.
"""
source = "docs/16 §2"
quiz = { q = "단어 이동이 U/I 에서 I/O 로 옮겨 간 까닭은?", choices = ["위 행은 긴 손가락(중지·약지)이 유리해서", "U 가 한글 입력에 필요해서", "O 가 더 크게 생겨서", "Vim 과 똑같이 하려고"], answer = 0 }

[[scroll]]
id = "四"
title = "레이어 불변식"
body = """
레이어에는 잘못 눌러도 해가 없는 수만 둔다 — 이동, 글자 삭제, 런처.
붙여넣기·줄 삭제 같은 비싼 수는 한글 Shift 오타 한 번에 사고가 된다.
그래서 P(붙여넣기)·Y·U·, 의 옛 매핑은 2026-08 에 지워졌다.
"""
source = "docs/16 §1-2"
quiz = { q = "다음 중 레이어에 두면 안 되는 수는?", choices = ["붙여넣기", "한 칸 이동", "앞 글자 지우기", "런처 띄우기"], answer = 0 }

[[scroll]]
id = "五"
title = "축지법"
body = """
한 칸씩 걷지 말고 단어로 건너라.
L 열두 번보다 O 두 번이 빠르고, 덜 피곤하고, 덜 틀린다.
"""
source = "docs/16 §1-2"
quiz = { q = "커서를 세 단어 오른쪽으로 옮기는 가장 싼 수는?", choices = ["단어 → 세 번", "→ 를 글자 수만큼", "줄 끝으로 갔다가 돌아오기", "마우스로 클릭"], answer = 0 }

[[scroll]]
id = "六"
title = "P 의 안전지대"
body = """
두벌식에서 ㅖ 는 Shift+P 다. CapsLock 과 LShift 는 같은 새끼손가락 이웃이라
레이어를 쥔 채 ㅖ 를 치려다 P 가 눌리는 일이 잦다.
그래서 nav 레이어의 P 는 비워 둔다.
"""
source = "docs/16 §3"
quiz = { q = "nav 레이어 P 를 비워 둔 까닭은?", choices = ["ㅖ(Shift+P) 오타가 잦은 자리라서", "P 키가 고장 나기 쉬워서", "붙여넣기는 쓸모가 없어서", "Vim 에 P 가 없어서"], answer = 0 }

[[scroll]]
id = "七"
title = "완충지대"
body = """
nav 레이어의 , 는 일부러 비워 두었다.
가장 자주 쓰는 삭제 키 . 바로 옆이라, 손가락이 한 칸 미끄러져도
아무 일도 일어나지 않게 하는 완충지대다.
"""
source = "docs/16 §1-2"
quiz = { q = "nav 레이어에서 , 자리를 비워 둔 까닭은?", choices = ["가장 자주 쓰는 삭제 키 . 옆의 완충지대라서", "쉼표는 한글 입력에 꼭 필요해서", "검지가 이미 과부하라서", "아직 기능을 정하지 못해서"], answer = 0 }

[[scroll]]
id = "八"
title = "U 를 비운 까닭"
body = """
오른손 검지는 이미 H·J·N·M 을 맡는다.
U 까지 얹으면 가장 자주 쓰는 수 다섯이 한 손가락에 몰리고,
U↔H/J/N/M 이 전부 같은 손가락의 행 왕복이 된다.
"""
source = "docs/16 §4"
quiz = { q = "U 를 비워 둔 주된 까닭은?", choices = ["검지 과부하와 같은 손가락 왕복을 막으려고", "U 는 모음이라서", "U 는 위 행이라 아예 못 쓴다", "새끼손가락 자리라서"], answer = 0 }

[[scroll]]
id = "九"
title = "CapsLock 승격"
body = """
트리거가 Alt 같은 modifier 면, 그 modifier 를 쓰는 앱 단축키를 가린다
(한글 워드의 Alt+Shift+N 등). CapsLock 은 modifier 가 아니라 아무것도 가리지 않는다.
대가도 있다 — HHKB 식 CapsLock 모드탭(탭 Caps / 홀드 Ctrl)과는 함께 쓸 수 없다.
"""
source = "docs/13"
quiz = { q = "트리거를 LAlt 로 되돌리면 생기는 일은?", choices = ["앱의 Alt 단축키를 가리지만 CapsLock 모드탭이 살아난다", "아무 변화가 없다", "레이어가 두 배 빨라진다", "한/영 전환이 사라진다"], answer = 0 }

[[scroll]]
id = "十"
title = "탭은 무동작"
body = """
CapsLock 을 짧게 스쳐도 아무 일도 일어나지 않는다.
Shift 를 누르려다 CapsLock 을 건드려 대문자가 쏟아지는 사고는 이제 없다.
"""
source = "docs/13"
quiz = { q = "CapsLock 을 짧게 탭하면?", choices = ["아무 일도 일어나지 않는다", "대문자 잠금이 켜진다", "한/영이 바뀐다", "런처가 뜬다"], answer = 0 }

[[scroll]]
id = "十一"
title = "한영은 제자리"
body = """
한/영은 수십 년 근육기억 그대로 스페이스바 오른쪽 — RAlt 를 짧게 톡.
한국어 키보드의 물리 한/영 키 자리이고, macOS 에서도 같은 자리(오른쪽 Option)다.
"""
source = "README 미션 3"
quiz = { q = "한/영 전환을 RAlt 탭에 둔 까닭은?", choices = ["한국어 키보드의 한/영 키 자리라 근육기억과 같아서", "RAlt 는 아무도 안 써서", "CapsLock 이 고장 나서", "macOS 에만 맞추려고"], answer = 0 }

[[scroll]]
id = "十二"
title = "300ms"
body = """
더블탭은 300ms 안의 두 번째 탭이다. 한/영 탭을 너무 빨리 연타하면
두 번째는 무시된다 — 전환이 겹쳐 입력 소스 선택 창이 엉키는 사고를 막는 장치다.
"""
source = "docs/13"
quiz = { q = "한/영 탭을 300ms 안에 두 번 치면?", choices = ["두 번째는 무시된다", "두 번 전환된다", "레이어가 열린다", "런처가 뜬다"], answer = 0 }

[[scroll]]
id = "十三"
title = "ESDF 의 이치"
body = """
WASD 는 검지를 D 에 묶어 타이핑 홈포지션(검지 F)을 한 칸 깨뜨린다.
ESDF 는 손을 홈에 둔 채 조작되고, 덤으로 Q·W·R·T·A·G 가 확장 자리로 열린다.
"""
source = "docs/16 §1-3"
quiz = { q = "포인터 이동이 WASD 가 아니라 ESDF 인 까닭은?", choices = ["홈포지션(검지 F)을 깨지 않으려고", "게임과 다르게 하려고", "W 가 고장 나기 쉬워서", "ESDF 가 더 짧아서"], answer = 0 }

[[scroll]]
id = "十四"
title = "클릭은 공간을 따른다"
body = """
이동 클러스터 E 의 왼쪽 W 는 왼쪽 버튼, 오른쪽 R 은 오른쪽 버튼.
위 키 T 는 위로 스크롤, 아래 키 G 는 아래로. 외울 것이 없다.
"""
source = "docs/16 §1-3"
quiz = { q = "마우스 레이어에서 우클릭이 R 인 까닭은?", choices = ["이동 클러스터의 오른쪽이라서", "Right 의 R 이라서", "가장 센 손가락이라서", "우연이다"], answer = 0 }

[[scroll]]
id = "十五"
title = "드래그는 엄지가"
body = """
W 는 S(← 이동)와 같은 약지라, W 로 클릭을 쥐면 왼쪽으로 끌 수 없다.
그래서 드래그는 Space — 엄지가 맡는다. 이동 손가락과 겹치지 않는다.
"""
source = "docs/16 §1-3"
quiz = { q = "드래그를 W 가 아니라 Space 로 하는 까닭은?", choices = ["W 와 S 가 같은 약지라 쥔 채 왼쪽 이동이 안 돼서", "Space 가 더 커서", "W 는 우클릭이라서", "엄지가 제일 세서"], answer = 0 }

[[scroll]]
id = "十六"
title = "가속"
body = """
마우스 사용의 대부분은 목표까지 가서 누르는 것이다.
그래서 포인터는 조준할 땐 느리게 시작하고, 멀리 갈 땐 빠르게 붙는다.
정밀하게 맞출 땐 LShift 를 함께 쥔다.
"""
source = "README 미션 4"
quiz = { q = "포인터가 처음엔 느리고 점점 빨라지는 까닭은?", choices = ["가까이는 정확하게, 멀리는 빠르게 가려고", "CPU 를 아끼려고", "OS 제한 때문에", "버그다"], answer = 0 }

[[scroll]]
id = "十七"
title = "막힌 레이어, 열린 레이어"
body = """
nav 레이어는 매핑 없는 키를 그대로 통과시킨다(plain) — 왼손은 평소처럼 친다.
마우스 레이어는 막는다(block) — 마우스 조작 중 오타가 글자로 새지 않는다.
"""
source = "docs/16 §1"
quiz = { q = "마우스 레이어가 매핑 없는 키를 막는 까닭은?", choices = ["조작 중 오타가 글자로 새지 않게", "키보드를 쉬게 하려고", "nav 레이어와 똑같이 하려고", "속도를 높이려고"], answer = 0 }

[[scroll]]
id = "十八"
title = "Shift 는 선택이다"
body = """
nav 레이어를 쥔 채 LShift 를 더하면 모든 이동이 선택이 된다.
선택하고 . 한 번 — 글자를 하나씩 지우지 않는다.
"""
source = "docs/16 §1-2"
quiz = { q = "단어 하나를 가장 싸게 지우는 법은?", choices = ["Shift+단어 이동으로 잡고 한 번 지우기", "글자 수만큼 백스페이스", "마우스로 더블클릭", "줄 전체 지우기"], answer = 0 }

[[scroll]]
id = "十九"
title = "소환 → 입력 → Enter"
body = """
keymander 의 나머지 모든 기능은 이 루프를 더 많은 대상
(웹, AI, 이모지, 셸, 번역)에 적용한 것이다.
"""
source = "README 첫 60초"
quiz = { q = "keymander 의 기본 루프는?", choices = ["소환 → 입력 → Enter", "탐색기 → 폴더 → 더블클릭", "단축키 외우기", "마우스 → 메뉴 → 클릭"], answer = 0 }

[[scroll]]
id = "二十"
title = "찾지 말고 불러라"
body = """
.pdf 로 종류를, @gh 로 웹을, ! 로 셸을 — 접두사 하나가 검색창을 다른 도구로 바꾼다.
찾아 헤매는 대신 이름을 부른다.
"""
source = "README 미션 1"
quiz = { q = "GitHub 에서 keymander 를 찾는 가장 짧은 입력은?", choices = ["@gh keymander", "github.com 열고 검색", "keymander github", ".gh keymander"], answer = 0 }

[[scroll]]
id = "二十一"
title = "같은 손가락 왕복"
body = """
같은 손가락이 행을 오가는 연속 입력은 피로와 실수의 가장 큰 원인이다.
배치를 바꿀 때는 그 왕복이 늘지 않는지부터 본다.
"""
source = "docs/16 §2"
quiz = { q = "배치를 바꿀 때 먼저 볼 것은?", choices = ["같은 손가락의 행 왕복이 늘지 않는지", "키 이름이 예쁜지", "Vim 과 같은지", "키캡 색"], answer = 0 }

[[scroll]]
id = "二十二"
title = "놓을 때 실행"
body = """
nav 레이어의 Space 는 런처를 띄운다 — 누를 때가 아니라 트리거를 놓을 때.
레이어를 쥔 채 엄지가 스쳐도 바로 터지지 않는다.
"""
source = "docs/16 §1-2"
quiz = { q = "nav 레이어 Space 런처는 언제 실행되는가?", choices = ["트리거를 놓을 때", "Space 를 누르는 즉시", "두 번 눌러야", "실행되지 않는다"], answer = 0 }

[[scroll]]
id = "二十三"
title = "One keymap, three OSes"
body = """
어떤 기계 앞에 앉아도 손은 같은 언어를 쓴다.
Windows · macOS · Linux 에서 같은 키맵, 같은 런처, 같은 손가락 움직임.
이것이 이 프로젝트가 존재하는 이유다.
"""
source = "README 철학"
quiz = { q = "keymander 가 존재하는 이유는?", choices = ["어느 OS 에서든 같은 근육기억을 쓰려고", "가장 빠른 런처가 되려고", "Vim 을 대체하려고", "마우스를 없애려고"], answer = 0 }

[[scroll]]
id = "二十四"
title = "One binary, no ceremony"
body = """
~3MB 단일 바이너리, SQLite + TOML 파일 하나, 즉시 시작.
도구가 가벼워야 손이 도구를 잊는다.
"""
source = "README 철학"
quiz = { q = "keymander 의 설치 철학은?", choices = ["단일 바이너리, 요란한 설치 없음", "Electron 앱", "런타임 필수", "서버 필요"], answer = 0 }
