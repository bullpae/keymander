# kmd dojo 커리큘럼 — 띠·과·관문 (docs/10 §3)
#
# 문구에는 물리 키 이름을 쓰지 않는다. 수 자리표시자만 쓴다(docs/10 §6-5):
#   {WordLeft}      → 사용자 배치의 전체 표기 (예: CapsLock+I)
#   {key:WordLeft}  → 쥐는 키를 뺀 키 (예: I)
#   {nav} {mouse}   → 레이어 트리거 (예: CapsLock, RAlt)
#
# kind 가 아직 구현되지 않은 과는 지도에 "수련장 공사 중"으로 보인다.
# 구현된 kind: summon · spar · maze · golf · mouse · ime · mixed · quiz · daily · seal
#              (content.rs READY_KINDS)
#
# 종류별 설정
#   spar   style = "card" | "rain", count, speed_ms(화살 간격), fall_ms(낙하 시간)
#   maze   set = maze.toml 의 세트
#   golf   set = golf.toml 의 코스
#   mouse  set = move | aim | wheel | drag | leak | rats, count, par_time_s
#   ime    set = ime.toml 의 묶음, par_time_s
#   mixed  [[stage]] 를 잇는다 — from(빌려 올 과) · label · skip · take · count
#   quiz   count(문항 수) — 비급 시험
#   daily  days(연속일 조건) — 오늘의 수련
#   seal   seals(인장 수 조건) — 인장 화면
#   공통   skip · take = 세트에서 쓸 구간, moves = 대련 카드의 수 묶음

[[belt]]
id = "white"
name = "흰띠"
theme = "첫 60초"
motto = "찾지 말고 불러라. 소환 → 입력 → Enter, 나머지는 전부 이 루프의 확장이다."

  [[belt.lesson]]
  id = "white.1"
  title = "이름 몇 글자로 소환"
  kind = "summon"
  set = "names"
  why = "앱 이름을 다 칠 필요는 없다. 몇 글자면 1순위로 올라온다."
  teach = ["런처를 띄우고 이름 몇 글자를 친다.", "1순위가 맞으면 Enter. 아니면 한 글자를 더 친다.", "↓↑ 로 고를 수도 있지만, 한 글자 더 치는 쪽이 대개 싸다."]
  scroll = "十九"

  [[belt.lesson]]
  id = "white.2"
  title = "확장자로 소환"
  kind = "summon"
  set = "ext"
  why = ".pdf 처럼 점으로 시작하면 그 확장자 파일만 남는다."
  teach = [".확장자 로 종류를 좁힌다.", "이름 조각을 아는 편이 대개 더 짧다 — 둘 중 싼 쪽을 고른다.", "목록이 길면 {Down} 으로 내려가 Enter."]
  scroll = "二十"

  [[belt.lesson]]
  id = "white.3"
  title = "의뢰 소환"
  kind = "summon"
  set = "asks"
  why = "의뢰는 사람의 말로 온다. 파일 이름의 어느 조각이 가장 드문지 떠올려라."
  teach = ["의뢰를 읽고 목표 파일 이름을 짐작한다.", "남들과 겹치지 않는 조각을 친다 — 짧고 드물수록 좋다.", "사부의 수는 결과 화면에서 공개된다."]
  scroll = "二十四"

  [[belt.lesson]]
  id = "white.4"
  title = "접두 비급"
  kind = "summon"
  set = "prefix"
  why = "@ 는 웹, ! 는 셸. 접두사 하나가 검색창을 다른 도구로 바꾼다."
  teach = ["@gh 검색어 — GitHub 에서 찾는다.", "@yt · @g · @w … 서비스마다 짧은 접두사가 있다.", "! 명령 — 셸에서 바로 실행한다."]
  scroll = "二十三"

  [belt.boss]
  id = "white.boss"
  name = "미아귀(迷兒鬼)"
  kind = "summon"
  set = "boss"
  line = "탐색기를 열어라… 폴더를 하나씩 눌러 헤매거라…"
  why = "탐색기에서 길을 잃게 만드는 귀신. 연속 의뢰를 제한 시간 안에 소환해 물리친다."
  time_limit_s = 120
  scroll = "二十二"

[[belt]]
id = "yellow"
name = "노란띠"
theme = "화살표 없는 화살표"
motto = "왼손이 쥐고, 오른손이 움직인다. 화살표 키로 손을 보내는 순간 홈로우를 떠난 것이다."

  [[belt.lesson]]
  id = "yellow.1"
  title = "네 방향"
  kind = "spar"
  style = "card"
  count = 16
  why = "{nav} 을 쥐고 {key:Left} {key:Down} {key:Up} {key:Right} — Vim 의 그 자리, 모든 앱에서."
  teach = ["{nav} 은 쥐는 손, 방향 키는 움직이는 손.", "{key:Left} ← · {key:Down} ↓ · {key:Up} ↑ · {key:Right} →", "보지 말고 느껴라."]
  needs = ["Left", "Down", "Up", "Right"]
  scroll = "一"

  [[belt.lesson]]
  id = "yellow.2"
  title = "미로 탈출"
  kind = "maze"
  set = "maze"
  why = "격자 미로를 레이어 방향키만으로 빠져나간다."
  teach = ["벽에 부딪히면 한 타가 날아간다.", "엽전 ◆ 을 모두 주워야 문 門 이 열린다.", "세 번째 미로는 어둡다 — 지나온 길만 기억난다."]
  needs = ["Left", "Down", "Up", "Right"]
  scroll = "二"

  [[belt.lesson]]
  id = "yellow.3"
  title = "화살비"
  kind = "spar"
  style = "rain"
  count = 32
  speed_ms = 620
  fall_ms = 2000
  why = "네 갈래로 떨어지는 화살을 판정선에서 받아친다. 콤보가 끊기지 않게."
  teach = ["화살이 판정선 ━ 에 닿는 순간 그 방향.", "極 · 妙 · 可 — 박자가 맞을수록 높다.", "놓치거나 헛손질하면 콤보가 끊긴다."]
  needs = ["Left", "Down", "Up", "Right"]
  scroll = "三"

  [belt.boss]
  id = "yellow.boss"
  name = "화살귀(箭鬼) 1형"
  kind = "spar"
  style = "rain"
  count = 48
  speed_ms = 540
  fall_ms = 1500
  needs = ["Left", "Down", "Up", "Right"]
  line = "네 오른손은 결국 화살표로 돌아올 것이다!"
  why = "화살표 키로 손을 끌어내는 귀신. 화살비를 받아쳐 쓰러뜨려라."
  scroll = "十"

[[belt]]
id = "orange"
name = "주황띠"
theme = "축지법"
motto = "적게 누르는 것이 곧 빠른 것이다."

  [[belt.lesson]]
  id = "orange.1"
  title = "단어 점프"
  kind = "golf"
  set = "jump"
  why = "{WordRight} 두 번이면 {Right} 열두 번이 필요 없다."
  teach = ["{key:WordLeft} 단어 ← · {key:WordRight} 단어 →", "깃발까지 가장 적은 타수로."]
  needs = ["WordLeft", "WordRight"]
  scroll = "五"

  [[belt.lesson]]
  id = "orange.2"
  title = "줄 처음과 끝"
  kind = "golf"
  set = "line"
  why = "같은 키를 두 번 톡톡 — {LineStart} 은 줄 처음, {LineEnd} 은 줄 끝."
  teach = ["300ms 안에 두 번.", "첫 탭은 단어 이동으로 먼저 도착한다 — 그래서 2타다."]
  needs = ["LineStart", "LineEnd"]
  scroll = "十二"

  [[belt.lesson]]
  id = "orange.3"
  title = "페이지"
  kind = "golf"
  set = "page"
  why = "{PageUp} · {PageDown} — 긴 문서는 페이지로 건넌다."
  teach = ["한 페이지 = 화면 한 장(8줄).", "{key:PageDown} 아래 장 · {key:PageUp} 위 장", "장을 넘긴 뒤 남은 몇 줄은 방향 키로."]
  needs = ["PageUp", "PageDown"]
  scroll = "八"

  [[belt.lesson]]
  id = "orange.4"
  title = "지우기"
  kind = "golf"
  set = "delete"
  why = "{Backspace} 는 앞을, {Delete} 는 뒤를 — 백스페이스까지 손을 뻗지 않는다."
  teach = ["{key:Backspace} 앞 글자 · {key:Delete} 뒷 글자", "빨간 군더더기만 지워진다 — 멀쩡한 글자는 칼이 튕겨 나온다.", "군더더기 앞에 서면 {key:Delete}, 뒤에 서면 {key:Backspace}."]
  needs = ["Backspace", "Delete"]
  scroll = "七"

  [belt.boss]
  id = "orange.boss"
  name = "화살귀(箭鬼) 2형"
  kind = "golf"
  set = "boss"
  needs = ["WordLeft", "WordRight"]
  line = "열두 번 두드려라, 열두 번!"
  why = "축지 코스 9홀을 지나 2형을 물리친다."
  scroll = "六"

