  why = "실전 혼합으로 3형을 물리친다."
  scroll = "十七"

[[belt]]
id = "blue"
name = "파란띠"
theme = "한 손가락 두 얼굴"
motto = "수십 년 쓴 그 자리다. 손가락은 이미 알고 있다."

  [[belt.lesson]]
  id = "blue.1"
  title = "한영 리듬"
  kind = "ime"
  set = "rhythm"
  par_time_s = 90
  why = "{ToggleHangul} — 혼합 문장의 전환 지점에서 톡."
  needs = ["ToggleHangul"]
  scroll = "十一"

  [[belt.lesson]]
  id = "blue.2"
  title = "톡과 쥠"
  kind = "ime"
  set = "taphold"
  par_time_s = 80
  why = "짧게 톡이면 한/영, 길게 쥐면 레이어가 열린다."
  needs = ["ToggleHangul", "ClickLeft"]
  scroll = "九"

  [[belt.lesson]]
  id = "blue.3"
  title = "300ms 안전장치"
  kind = "ime"
  set = "guard"
  par_time_s = 70
  why = "너무 빨리 두 번 치면 두 번째는 무시된다 — 전환 겹침을 막는 장치다."
  needs = ["ToggleHangul"]

  [belt.boss]
  id = "blue.boss"
  name = "양설귀(兩舌鬼)"
  kind = "ime"
  set = "boss"
  time_limit_s = 150
  line = "한 입으로 두 말을 해 보아라!"
  why = "혼합 문장 타임어택."

[[belt]]
id = "purple"
name = "보라띠"
theme = "보이지 않는 마우스"
motto = "멀리는 빠르게, 가까이는 느리게. 가속은 네 편이다."

  [[belt.lesson]]
  id = "purple.1"
  title = "포인터 이동"
  kind = "mouse"
  set = "move"
  count = 8
  par_time_s = 40
  teach = ["과녁 ◎ 위에 포인터를 올리면 맞는다.", "멀면 쭉 누르고 있어라 — 가속이 붙는다. 가까우면 톡톡.", "포인터는 이 터미널 창 안에서만 보인다."]
  why = "{mouse} 을 쥐고 {key:PointerUp} {key:PointerLeft} {key:PointerDown} {key:PointerRight} — 손은 홈포지션 그대로."
  needs = ["PointerUp", "PointerDown", "PointerLeft", "PointerRight"]
  scroll = "十三"

  [[belt.lesson]]
  id = "purple.2"
  title = "조준"
  kind = "mouse"
  set = "aim"
  count = 10
  par_time_s = 45
  teach = ["과녁에 적힌 버튼으로 눌러라 — 좌 는 {key:ClickLeft}, 우 는 {key:ClickRight}.", "작은 과녁은 {key:Precision} 을 함께 쥐면 느려진다.", "빗나가면 기록에 남는다."]
  why = "{key:ClickLeft} 좌클릭, {key:ClickRight} 우클릭 — 이동 키의 왼쪽과 오른쪽."
  needs = ["ClickLeft", "ClickRight"]
  scroll = "十四"

  [[belt.lesson]]
  id = "purple.3"
  title = "휠 수색"
  kind = "mouse"
  set = "wheel"
  count = 4
  par_time_s = 50
  teach = ["긴 목록에서 찾는 비급을 휠로 끌어온다.", "{key:WheelDown} 아래로 · {key:WheelUp} 위로", "보이면 {key:ClickLeft} 로 집는다."]
  why = "{key:WheelUp} 위로, {key:WheelDown} 아래로."
  needs = ["WheelUp", "WheelDown"]
  scroll = "十六"

  [[belt.lesson]]
  id = "purple.4"
  title = "드래그"
  kind = "mouse"
  set = "drag"
  par_time_s = 60
  teach = ["파일 위에서 좌클릭을 쥔 채 옮겨 폴더에 놓는다.", "쥐는 일은 엄지(스페이스)가 — 이동 손가락과 겹치지 않게.", "폴더 밖에 놓으면 제자리로 돌아간다."]
  why = "드래그는 엄지가 맡는다 — 이동 손가락과 겹치지 않는다."
  needs = ["ClickLeft"]
  scroll = "十五"

  [[belt.lesson]]
  id = "purple.5"
  title = "새는 글자 0"
  kind = "mouse"
  set = "leak"
  teach = ["Enter 로 시작 — 3초 안에 {mouse} 을 쥐어라.", "쥔 채로 6초 동안 아무 글자나 마구 쳐라. 포인터도 흔들어라.", "한 글자도 새지 않으면 통과다."]
  why = "{mouse} 을 쥔 채 아무 글자나 마구 쳐 보아라. 한 글자도 새지 않는다."
  needs = ["PointerUp"]

  [belt.boss]
  id = "purple.boss"
  name = "쥐마왕(鼠魔王)"
  kind = "mouse"
  set = "rats"
  needs = ["PointerUp", "PointerDown", "PointerLeft", "PointerRight", "ClickLeft"]
  line = "결국 너는 나를 잡게 될 것이다!"
  why = "마우스로 손을 끌어내는 마왕. 과녁장을 가로지르는 쥐를 잡아라."
  scroll = "二十一"

[[belt]]
id = "brown"
name = "갈색띠"
theme = "레이어 불변식"
