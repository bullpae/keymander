# 한영 리듬 문장 (docs/10 §4-3 S11, 파란띠)
#
# 판정은 도착한 글자로 한다. 한글이 와야 할 자리에 영문이 오면(또는 그 반대)
# "전환 놓침"이다. 한글은 IME 가 조합을 마친 글자가 도착하므로, 문장 끝의
# 한글 한 글자는 다음 공백·문장부호에서 확정된다 — 문장은 마침표로 끝낸다.
# 한 줄 40자 이하, 줄마다 한/영 전환이 적어도 한 번은 있어야 한다(테스트).

[[set]]
id = "rhythm"
lines = [
  "kmd 로 PDF 를 찾는다.",
  "CapsLock 을 쥐고 HJKL 로 움직인다.",
  "README 에 설치 방법을 적었다.",
  "git push 전에 test 를 돌린다.",
  "Tab 으로 다음 칸, Enter 로 실행.",
  "오늘 회의는 Zoom 대신 Meet 에서.",
]

[[set]]
id = "taphold"
click = true
lines = [
  "한영은 톡, 마우스는 RAlt 쥠.",
  "쥐었다 놓아도 한글은 그대로다.",
  "다시 톡 하면 English 로 돌아온다.",
  "쥠은 레이어, 톡은 IME 전환.",
]

[[set]]
id = "guard"
lines = [
  "a 가 b 나 c 다.",
  "F1 키, F2 키, F5 키.",
  "x 축과 y 축과 z 축.",
  "1번은 A, 2번은 B, 3번은 C.",
  "OS 별로 Win 과 Mac 이 다르다.",
]

[[set]]
id = "boss"
lines = [
  "양설귀: 한 입으로 two 말을!",
  "kmd dojo 에서 수련하고 kmd setup 으로 설치.",
  "Shift 는 선택, Space 는 드래그.",
  "Ctrl+C 는 복사, 붙여넣기는 Ctrl+V.",
  "삼국 통일: Windows, macOS, Linux.",
  "홈로우를 떠나지 않는 하루, today.",
]
