# 미로 (docs/10 §6-4) — `#` 벽 · `S` 시작 · `E` 문 · `$` 엽전 · 공백 바닥
# 엽전을 모두 주워야 문이 열린다. 사부의 수는 BFS 최단 경로(maze.rs)로 구하고,
# 모든 미로는 테스트가 탈출 가능·화면 크기(38×13)를 검증한다.

[[set]]
id = "maze"

  [[set.maze]]
  title = "첫 미로"
  map = """
#####################
#S#               # #
# ### ##### ##### # #
#   #   #         # #
### ### # # # ##### #
#   #   # # #   #   #
# # ##### # ### ### #
#         #        E#
#####################"""

  [[set.maze]]
  title = "엽전 둘"
  map = """
#############################
#S#         #           #$  #
# # # ##### # ####### # ### #
#     #     #  $#   # #     #
# # # # ######### # # #######
# #   #           # #       #
# ### ############# # ### # #
#           #       # #   # #
####### ##### # ####### # # #
#                       #  E#
#############################"""

  [[set.maze]]
  title = "어둠 미로"
  fog = true
  map = """
###############################
#S                        #   #
# # # # ######### ####### ### #
#     # #   #     #     # #   #
####### # # # ####### # # # # #
# #   #   # #   #     # #   # #
# # # ##### ### # # ######### #
#   #     #     # #           #
# ##### # ####### ####### # ###
#    $#                 #    E#
###############################"""
