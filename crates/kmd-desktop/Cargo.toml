[package]
name = "kmd-desktop"
version = "0.16.5"
edition = "2021"
description = "keymander Desktop — GPU-accelerated launcher with iced"
license = "MIT"
default-run = "kmd-desktop"

[[bin]]
name = "kmd-desktop"
path = "src/main.rs"

[dependencies]
kmd-core = { path = "../kmd-core" }

# GUI
iced = { version = "0.14", features = ["tokio", "image", "svg"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
image = { version = "0.25", default-features = false, features = ["png"] }

# OS integration
open = "5"
arboard = "3.6.1"

# Serialization (window state persistence)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# macOS: Info.plist 파싱 (.app 번들 아이콘 추출)
[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
core-foundation-sys = "0.8"
# CAMetalLayer 리사이즈 거동 교정 (platform::stabilize_surface_layer)
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }

# Windows APIs (DWM square corners, IME/keyboard layout switching, foreground focus)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Ime",
    "Win32_UI_TextServices",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
