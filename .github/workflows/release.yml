name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Match tag and Cargo package versions
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # 기존 태그 관례(v0.x.y-rc1)와 Cargo SemVer(0.x.y-rc.1)를 정규화한다.
          EXPECTED_VERSION="$(sed -E 's/-rc([0-9]+)$/-rc.\1/' <<< "$TAG_VERSION")"
          for manifest in \
            Cargo.toml \
            crates/kmd-core/Cargo.toml \
            crates/kmd-daemon/Cargo.toml \
            crates/kmd-desktop/Cargo.toml
          do
            PACKAGE_VERSION="$(awk -F '"' '/^version = / { print $2; exit }' "$manifest")"
            if [[ "$PACKAGE_VERSION" != "$EXPECTED_VERSION" ]]; then
              echo "::error file=$manifest::tag $GITHUB_REF_NAME expects $EXPECTED_VERSION, found $PACKAGE_VERSION"
              exit 1
            fi
          done

  # 태그가 가리키는 커밋에서 테스트를 직접 돌린다.
  #
  # 예전에는 빌드 잡들이 validate-version에만 의존해서, **CI 테스트가 실패해도
  # 릴리스가 게시됐다**(v0.16.5에서 Windows 테스트가 깨진 채 배포됨). 별도
  # 워크플로인 CI의 성공 여부는 릴리스가 알지 못하므로, 여기서 다시 돌려
  # 게시 전에 막는다. 빌드보다 빠르게 끝나 전체 시간도 거의 늘지 않는다.
  test-release-commit:
    name: Test (${{ matrix.os }})
    needs: validate-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libxcb-xfixes0-dev libwayland-dev libxkbcommon-dev libfontconfig1-dev \
            libudev-dev libssl-dev
      - run: cargo test --workspace --locked
        env:
          KMD_E2E: "1"

  build-cli:
    name: Build CLI ${{ matrix.target }}
    needs: [validate-version, test-release-commit]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: kmd
            prefix: kmd
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: kmd
            prefix: kmd
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: kmd
            prefix: kmd
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: kmd.exe
            prefix: kmd
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: kmd.exe
            prefix: kmd

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Validate
        run: cargo check --workspace

      - name: Build
        run: cargo build --release -p keymander --target ${{ matrix.target }} --locked

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.prefix }}-${{ matrix.target }}.tar.gz ${{ matrix.artifact }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.prefix }}-${{ matrix.target }}.zip ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.prefix }}-${{ matrix.target }}
          path: ${{ matrix.prefix }}-${{ matrix.target }}.*

  build-desktop:
    name: Build Desktop ${{ matrix.target }}
    needs: [validate-version, test-release-commit]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: kmd-desktop
            prefix: kmd-desktop
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: kmd-desktop
            prefix: kmd-desktop
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: kmd-desktop
            prefix: kmd-desktop
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: kmd-desktop.exe
            prefix: kmd-desktop
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: kmd-desktop.exe
            prefix: kmd-desktop

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system deps (iced/winit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libwayland-dev libxkbcommon-dev libfontconfig1-dev \
            libudev-dev libssl-dev

      - name: Validate
        run: cargo check --workspace

      - name: Build
        run: cargo build --release -p kmd-desktop --target ${{ matrix.target }} --locked

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.prefix }}-${{ matrix.target }}.tar.gz ${{ matrix.artifact }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.prefix }}-${{ matrix.target }}.zip ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.prefix }}-${{ matrix.target }}
          path: ${{ matrix.prefix }}-${{ matrix.target }}.*

  build-bundle:
    name: Portable Bundle ${{ matrix.target }}
    needs: [validate-version, test-release-commit]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            ext: ".exe"

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system deps (iced/winit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libwayland-dev libxkbcommon-dev libfontconfig1-dev \
            libudev-dev libssl-dev

      - name: Build all binaries
        run: |
          cargo build --release -p keymander --target ${{ matrix.target }} --locked
          cargo build --release -p kmd-desktop --target ${{ matrix.target }} --locked
          cargo build --release -p kmd-daemon --target ${{ matrix.target }} --locked

      - name: Stage portable bundle
        shell: bash
        run: |
          STAGE="keymander"
          mkdir -p "$STAGE/kmd-data"
          cp "target/${{ matrix.target }}/release/kmd${{ matrix.ext }}" "$STAGE/"
          cp "target/${{ matrix.target }}/release/kmd-desktop${{ matrix.ext }}" "$STAGE/"
          cp "target/${{ matrix.target }}/release/kmd-daemon${{ matrix.ext }}" "$STAGE/"
          case "${{ matrix.target }}" in
            *windows*) KEYMAP=windows ;;
            *apple-darwin*) KEYMAP=macos ;;
            *) KEYMAP=linux ;;
          esac
          cat dist/config.shared.toml "dist/config.keymap.${KEYMAP}.toml" > "$STAGE/kmd-data/config.toml"
          cp dist/README.txt "$STAGE/"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: tar czf keymander-portable-${{ matrix.target }}.tar.gz keymander

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: 7z a keymander-portable-${{ matrix.target }}.zip keymander

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: keymander-portable-${{ matrix.target }}
          path: keymander-portable-${{ matrix.target }}.*

  build-packages:
    name: Linux Packages (deb/rpm)
    needs: [validate-version, test-release-commit]
    # rc 등 프리릴리스 제외 — apt/yum 발행이 게이트되어 쓰일 곳이 없고,
    # RPM 버전 규칙이 '-'를 불허해 rc 버전(0.x.0-rc.1)에서 generate-rpm이 죽는다
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system deps (iced/winit + packaging)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libwayland-dev libxkbcommon-dev libfontconfig1-dev \
            libudev-dev libssl-dev dpkg-dev
      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm --locked

      - name: Build all binaries
        run: cargo build --release -p keymander -p kmd-desktop -p kmd-daemon --locked

      - name: Stage example config
        run: |
          mkdir -p target/package
          cat dist/config.shared.toml dist/config.keymap.linux.toml \
            > target/package/config.example.toml

      - name: Build .deb
        run: cargo deb -p keymander --no-build -o .

      - name: Build .rpm
        run: cargo generate-rpm -o .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: keymander-linux-packages
          path: |
            *.deb
            *.rpm

  release:
    name: Create Release
    needs: [build-cli, build-desktop, build-bundle, build-packages]
    # 기본 조건(success())은 needs 중 하나라도 skip이면 같이 skip된다 —
    # 프리릴리스에서 build-packages가 빠져도 릴리스는 만들어져야 하므로
    # "실패/취소만 없으면 진행"으로 완화한다.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum */* | awk '{n=split($2,p,"/"); print $1 "  " p[n]}' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          # rc 등 '-' 포함 태그는 프리릴리스로 표시 — latest로 잡히지 않게
          prerelease: ${{ contains(github.ref_name, '-') }}

  # 릴리스마다 GitHub Pages의 APT/YUM 저장소를 최근 릴리스 기준으로 재발행한다.
  # 이게 있어야 `apt update`/`dnf upgrade`로 갱신을 받을 수 있다.
  publish-repos:
    name: Publish apt/yum repos
    needs: release
    if: ${{ success() && !contains(github.ref_name, '-') }} # 선행 잡 성공 + rc 등 프리릴리스 제외
    # 재사용 워크플로는 호출자보다 권한을 높일 수 없다 — 피호출자(publish-repos.yml)가
    # 요구하는 pages/id-token write를 호출 잡에서 명시해야 워크플로 컴파일이 통과한다.
    # (안 하면 태그 푸시 즉시 startup_failure — if 게이트로 스킵되는 경우에도 검증된다)
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-repos.yml
    secrets: inherit

  # 릴리스마다 bullpae/homebrew-tap의 formula를 자동 갱신한다.
  #
  # 인증은 PAT가 아니라 homebrew-tap에 등록된 **쓰기 가능 deploy key**를 쓴다.
  # PAT(public_repo)는 계정의 모든 공개 저장소에 쓸 수 있고 만료 갱신이 필요하지만,
  # deploy key는 tap 저장소 하나에만 유효하고 만료가 없다.
  # TAP_DEPLOY_KEY 시크릿이 없으면 잡을 건너뛴다.
  update-tap:
    name: Update Homebrew Tap
    needs: release
    if: ${{ success() && !contains(github.ref_name, '-') }} # 선행 잡 성공 + rc 등 프리릴리스 제외
    runs-on: ubuntu-latest
    steps:
      - name: Check tap deploy key
        id: tap
        env:
          HAS_KEY: ${{ secrets.TAP_DEPLOY_KEY != '' }}
        run: echo "has=$HAS_KEY" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.tap.outputs.has == 'true'

      - uses: actions/download-artifact@v4
        if: steps.tap.outputs.has == 'true'
        with:
          path: artifacts

      - name: Generate and push formula
        if: steps.tap.outputs.has == 'true'
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sha() { sha256sum "artifacts/$1/$1.tar.gz" | cut -d' ' -f1; }
          scripts/gen-homebrew-formula.sh "$VERSION" \
            "$(sha keymander-portable-aarch64-apple-darwin)" \
            "$(sha keymander-portable-x86_64-apple-darwin)" \
            "$(sha keymander-portable-x86_64-unknown-linux-gnu)" \
            > keymander.rb

          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes"

          git clone git@github.com:bullpae/homebrew-tap.git tap
          mkdir -p tap/Formula
          cp keymander.rb tap/Formula/keymander.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/keymander.rb
          git diff --cached --quiet && exit 0
          git commit -m "keymander ${VERSION}"
          git push

  # 릴리스마다 microsoft/winget-pkgs에 버전 갱신 PR을 자동 제출한다.
  # 최초 등록(bullpae.keymander)이 머지된 뒤부터 동작하며,
  # WINGET_GITHUB_TOKEN(공개 저장소 fork/PR 권한 PAT) 시크릿이 없으면 건너뛴다.
  update-winget:
    name: Update winget package
    needs: release
    if: ${{ success() && !contains(github.ref_name, '-') }} # 선행 잡 성공 + rc 등 프리릴리스 제외
    runs-on: windows-latest
    steps:
      - name: Check winget token
        id: winget
        shell: bash
        env:
          HAS_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN != '' }}
        run: echo "has=$HAS_TOKEN" >> "$GITHUB_OUTPUT"

      - uses: vedantmgoyal9/winget-releaser@v2
        if: steps.winget.outputs.has == 'true'
        with:
          identifier: bullpae.keymander
          installers-regex: 'keymander-portable-(x86_64|aarch64)-pc-windows-msvc\.zip$'
          max-versions-to-keep: 5
          token: ${{ secrets.WINGET_GITHUB_TOKEN }}
