name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # 공개 저장소라 비밀정보는 커밋되는 순간 노출이고, 파일을 지워도 이력에 남는다.
  # GitHub push protection은 공급자 토큰(ghp_ 등)만 막고 개인키 블록 같은
  # 비공급자 패턴은 저장소 설정을 따로 켜야 잡히므로, 그 사각지대를 여기서 막는다.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 이력 전수 검사에 필요
      - run: scripts/scan-secrets.sh --history

  # Windows의 CP949 혼용 편집 환경에서 Cargo.toml 한글이 깨져 cargo-deb 빌드가
  # 실패한 적이 있다(87955e0). 깨진 바이트는 눈에 안 띄고 릴리스 끝에서야 터진다.
  encoding:
    name: Encoding check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/check-encoding.sh

  check:
    name: Check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system deps (iced/winit requires libx11, libxcb, etc.)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libwayland-dev libxkbcommon-dev libfontconfig1-dev \
            libudev-dev libssl-dev
      - run: cargo check --all-targets

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libwayland-dev libxkbcommon-dev libfontconfig1-dev \
            libudev-dev libssl-dev
      # KMD_E2E=1: 데몬 프로세스 E2E(tests/e2e_daemon.rs, unix 전용)까지 실행.
      # Windows는 테스트가 cfg(unix)로 컴파일 제외라 env가 있어도 무해하다.
      # --locked: Cargo.lock을 그대로 쓴다. 락이 낡았으면 조용히 갱신하는 대신
      # 실패해서, 빌드마다 의존성이 달라지는 일을 막는다.
      - run: cargo test --workspace --locked
        env:
          KMD_E2E: "1"

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libwayland-dev libxkbcommon-dev libfontconfig1-dev \
            libudev-dev libssl-dev
      - run: cargo clippy --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
